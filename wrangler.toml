name = "chili-app"
compatibility_date = "2024-01-01"

# ИСПРАВЛЕНО: Явно указываем точку входа Worker'а
main = "worker.js"

[assets]
directory = "./dist"

# ИСПРАВЛЕНО: Добавляем binding! Это связывает env.ASSETS в worker.js с папкой dist.
# Без этой строки Wrangler ругается на run_worker_first.
binding = "ASSETS"

# Запускаем Worker ПЕРВЫМ для всех запросов (чтобы перехватить POST /api/auth)
run_worker_first = true

# Drop trailing slash (prevents 301 POST-to-GET redirect bug)
html_handling = "drop-trailing-slash"

# SPA Fallback
not_found_handling = "single-page-application"